target_markets:
  - id: "ecommerce_sellers"
    name: "E-commerce Sellers & D2C Brands"
    priority: "high"
    why: "They constantly need product visuals but can't afford full-time 3D artists or expensive photography."
    pain_points:
      - "Product photography is expensive and time-consuming"
      - "Need consistent visual style across catalog"
      - "Want lifestyle/context shots without physical sets"
      - "Need to update visuals frequently for new products"
    services_match:
      - "product_renders"
      - "interactive_3d_web"
      - "marketing_content"
    where_to_find:
      - "Shopify app store reviews (brands asking for better visuals)"
      - "Amazon seller forums"
      - "Instagram D2C brands with poor product photos"
      - "IndiaMART sellers"
      - "Etsy sellers"
      - "Local markets going online"
    approach: "Show before/after comparison of 3D renders vs phone photos. Offer a free single-product render as proof of concept."
    budget_range: "₹5,000 - ₹50,000 per project"

  - id: "real_estate"
    name: "Real Estate Agents & Small Developers"
    priority: "high"
    why: "They need to sell properties before construction is complete, and 3D visualization makes this possible."
    pain_points:
      - "Can't show completed property to buyers"
      - "Competing with bigger developers who have better marketing"
      - "Need to differentiate listings"
      - "Virtual staging saves money vs physical staging"
    services_match:
      - "arch_viz"
      - "explainer_videos"
      - "small_websites"
    where_to_find:
      - "99acres.com agent listings"
      - "MagicBricks.com"
      - "Local real estate Facebook groups"
      - "Housing.com"
      - "Google Maps (search for real estate agencies in your city)"
      - "LinkedIn (real estate professionals)"
    approach: "Share examples of interior/exterior renders. Offer virtual staging for one listing as a trial."
    budget_range: "₹10,000 - ₹1,00,000 per project"

  - id: "interior_designers"
    name: "Interior Designers & Architects (Small Firms)"
    priority: "high"
    why: "They need visualizations to sell their designs to clients but many small firms can't afford in-house 3D."
    pain_points:
      - "Clients can't visualize designs from 2D plans"
      - "Rendering takes too long with their current workflow"
      - "Need photorealistic quality to close deals"
      - "Competition from bigger firms with better presentations"
    services_match:
      - "arch_viz"
      - "explainer_videos"
    where_to_find:
      - "Instagram (search #interiordesigner #mumbainteriors)"
      - "Houzz profiles"
      - "Google Maps (interior design studios)"
      - "LinkedIn"
      - "Local architect associations"
    approach: "Offer a free render of one room from their existing project. Show your kitchen/bedroom portfolio."
    budget_range: "₹8,000 - ₹60,000 per project"

  - id: "startups_tech"
    name: "Tech Startups & SaaS Companies"
    priority: "medium"
    why: "They need explainer videos and product visuals for fundraising, marketing, and onboarding."
    pain_points:
      - "Need to explain complex products visually"
      - "Investor decks need compelling visuals"
      - "Website hero sections look generic"
      - "Social media content is boring compared to competitors"
    services_match:
      - "explainer_videos"
      - "marketing_content"
      - "small_websites"
    where_to_find:
      - "AngelList/Wellfound startup listings"
      - "ProductHunt (recently launched products)"
      - "LinkedIn (startup founders)"
      - "YCombinator company directory"
      - "Local startup events and meetups"
      - "Twitter/X tech community"
    approach: "Reference how 3D explainer videos increase conversion. Offer a short 15-second teaser animation as a sample."
    budget_range: "₹15,000 - ₹1,50,000 per project"

  - id: "jewelry_fashion"
    name: "Jewelry & Fashion Accessory Brands"
    priority: "high"
    why: "Your jewelry configurator demo is a perfect portfolio piece. They need high-quality visuals and interactive experiences."
    pain_points:
      - "Photography of small shiny objects is extremely difficult"
      - "Need to show customization options"
      - "Want interactive try-before-you-buy experiences"
      - "Catalog photography is expensive for large collections"
    services_match:
      - "product_renders"
      - "interactive_3d_web"
      - "marketing_content"
    where_to_find:
      - "Instagram jewelry brands (small/medium)"
      - "Etsy jewelry sellers"
      - "Local jewelry stores going online"
      - "Bridal jewelry shops"
      - "Fashion accessory brands on Shopify"
    approach: "Share your live jewelry configurator demo directly. Show how customers can customize pieces in 3D on their website."
    budget_range: "₹10,000 - ₹2,00,000 per project"

  - id: "manufacturing_industrial"
    name: "Small Manufacturing & Industrial Companies"
    priority: "medium"
    why: "They have physical products but poor digital presence. 3D renders can transform their catalogs and websites."
    pain_points:
      - "Outdated website with poor product images"
      - "Need technical product visualizations"
      - "Want to show products from every angle"
      - "Assembly/disassembly animations for training"
    services_match:
      - "product_renders"
      - "explainer_videos"
      - "small_websites"
    where_to_find:
      - "IndiaMART listings (manufacturers with poor photos)"
      - "Google Maps (local manufacturers)"
      - "Industry exhibitions and trade shows"
      - "LinkedIn (manufacturing company pages)"
    approach: "Point out how competitors have better visuals. Offer to render one hero product for their website."
    budget_range: "₹8,000 - ₹75,000 per project"

  - id: "marketing_agencies"
    name: "Small Marketing & Creative Agencies"
    priority: "medium"
    why: "They often need 3D work for client projects but don't have an in-house 3D artist."
    pain_points:
      - "Client wants 3D content but agency can't deliver"
      - "Need reliable freelance 3D artist on call"
      - "Tight deadlines require fast turnaround"
      - "Need someone who understands marketing needs"
    services_match:
      - "marketing_content"
      - "explainer_videos"
      - "product_renders"
    where_to_find:
      - "LinkedIn (creative agency pages)"
      - "Clutch.co agency listings"
      - "Google Maps (advertising agencies in your area)"
      - "Agency job boards (they might be hiring freelancers)"
    approach: "Position as their go-to 3D partner. Offer a discounted first project to build the relationship."
    budget_range: "₹10,000 - ₹1,00,000 per project"

  - id: "restaurants_cafes"
    name: "Restaurants, Cafes & Hospitality"
    priority: "low"
    why: "Growing businesses that need better online presence. 3D walkthroughs and modern websites help them stand out."
    pain_points:
      - "Website is outdated or doesn't exist"
      - "Menu and ambiance not well represented online"
      - "Competing with chains that have better marketing"
      - "Need to attract customers through social media"
    services_match:
      - "small_websites"
      - "marketing_content"
      - "arch_viz"
    where_to_find:
      - "Google Maps (restaurants without websites)"
      - "Zomato/Swiggy listings with poor photos"
      - "Instagram food pages"
      - "Local business directories"
    approach: "Offer a modern website package at an affordable price. Show 3D interior renders of their space."
    budget_range: "₹5,000 - ₹30,000 per project"
