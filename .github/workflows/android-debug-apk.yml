name: Android debug APK

# Builds on every push; publishes ONE rolling GitHub Release (tag debug-apk-latest).
# Older dated debug-apk-* releases are removed so the Releases page stays clean.

on:
  push:
    branches:
      - "cursor/career-ops-india-78d5"
      - "main"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch: {}

concurrency:
  group: android-debug-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CareerOpsMobile-debug-${{ github.sha }}
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Stage APK and release notes (cursor branch only)
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/cursor/career-ops-india-78d5'
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk CareerOpsMobile-debug.apk
          {
            echo "**Latest automatic debug build** — install \`CareerOpsMobile-debug.apk\`; upgrades in place with the shared debug keystore."
            echo
            echo "| | |"
            echo "|-|-|"
            echo "| **Commit** | \`${GITHUB_SHA}\` |"
            echo "| **Branch** | \`${GITHUB_REF_NAME}\` |"
            echo "| **Workflow** | [This run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
            echo
            echo "Older \`debug-apk-*\` dated releases are removed automatically."
          } > release-notes.md

      - name: Prune dated debug-apk-* releases (not latest)
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/cursor/career-ops-india-78d5'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEEP=debug-apk-latest
          gh release list --limit 200 --json tagName --jq -r --arg keep "$KEEP" \
            '.[].tagName | select(test("^debug-apk-")) | select(. != $keep)' \
            | while read -r t; do
              [ -z "${t:-}" ] && continue
              echo "Pruning release: $t"
              gh release delete "$t" --yes 2>/dev/null || true
              enc=$(TAG="$t" python3 -c "import os, urllib.parse; print(urllib.parse.quote('refs/tags/' + os.environ['TAG'], safe=''))")
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/${enc}" 2>/dev/null || true
            done

      - name: Remove rolling debug-apk-latest (release + remote tag)
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/cursor/career-ops-india-78d5'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=debug-apk-latest
          echo "Removing release ${TAG} if present…"
          gh release delete "$TAG" --yes 2>/dev/null || true
          echo "Removing remote tag ${TAG} via API…"
          enc=$(TAG="$TAG" python3 -c "import os, urllib.parse; print(urllib.parse.quote('refs/tags/' + os.environ['TAG'], safe=''))")
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/${enc}" 2>/dev/null || true
          echo "Removing remote tag ${TAG} via git push (fallback)…"
          git push origin ":refs/tags/${TAG}" 2>/dev/null || true

      - name: Publish debug-apk-latest release
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/cursor/career-ops-india-78d5'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-apk-latest
          name: Career Ops Mobile — Debug (latest)
          body_path: release-notes.md
          files: CareerOpsMobile-debug.apk
          prerelease: true
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          fail_on_unmatched_files: true
