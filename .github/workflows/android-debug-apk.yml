name: Android debug APK

# Builds on every push; publishes ONE rolling GitHub Release (tag debug-apk-latest).
# Older dated debug-apk-* releases are removed so the Releases page stays clean.

on:
  push:
    branches:
      - "cursor/career-ops-india-78d5"
      - "main"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch: {}

concurrency:
  group: android-debug-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CareerOpsMobile-debug-${{ github.sha }}
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish single latest debug release (cursor branch only)
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/cursor/career-ops-india-78d5'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SRC="android-app/app/build/outputs/apk/debug/app-debug.apk"
          ASSET="CareerOpsMobile-debug.apk"
          TAG="debug-apk-latest"
          cp "$SRC" "$ASSET"

          echo "Removing old dated debug-apk-* releases (not ${TAG})…"
          gh release list --limit 200 --json tagName --jq -r --arg keep "$TAG" \
            '.[].tagName | select(test("^debug-apk-")) | select(. != $keep)' \
            | while read -r t; do
              [ -z "${t:-}" ] && continue
              echo "  delete release + tag: $t"
              gh release delete "$t" --yes --cleanup-tag 2>/dev/null || true
            done

          echo "Recreating rolling release ${TAG}…"
          # --cleanup-tag removes the git tag (required before gh release create can reuse the tag name).
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          ENC="$(TAG="${TAG}" python3 -c "import os, urllib.parse; print(urllib.parse.quote('refs/tags/' + os.environ['TAG'], safe=''))")"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/${ENC}" 2>/dev/null || true

          NOTES_FILE=$(mktemp)
          {
            echo "**Latest automatic debug build** — install \`${ASSET}\`; upgrades in place with the shared debug keystore."
            echo
            echo "| | |"
            echo "|-|-|"
            echo "| **Commit** | \`${GITHUB_SHA}\` |"
            echo "| **Branch** | \`${GITHUB_REF_NAME}\` |"
            echo "| **Workflow run** | [View run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
            echo
            echo "Older \`debug-apk-*\` dated releases are deleted each run so only this rolling release stays on the Releases page."
          } > "$NOTES_FILE"

          gh release create "$TAG" "$ASSET" \
            --title "Career Ops Mobile — Debug (latest)" \
            --prerelease \
            --notes-file "$NOTES_FILE" \
            --target "$GITHUB_SHA"

          rm -f "$NOTES_FILE"
