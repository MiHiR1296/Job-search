title_filter:
  positive:
    - "Software Engineer"
    - "Backend Engineer"
    - "Senior Software Engineer"
    - "SDE 2"
    - "SDE II"
    - "Platform Engineer"
    - "Full Stack Engineer"
    - "DevOps Engineer"
    - "Data Engineer"
    - "Machine Learning Engineer"
    - "Solutions Engineer"
  negative:
    - "Intern"
    - "Apprentice"
    - "Campus"
    - "BPO"
    - "Voice Process"
    - "Telecaller"
    - "Field Sales"
    - "Commission Only"
  seniority_boost:
    - "Senior"
    - "Lead"
    - "Staff"
    - "Principal"

search_queries:
  - name: Naukri - Backend Bengaluru
    query: 'site:naukri.com "Backend Engineer" "Bengaluru"'
    enabled: true

  - name: Naukri - Senior Software Engineer India
    query: 'site:naukri.com "Senior Software Engineer" "India"'
    enabled: true

  - name: Instahyre - SDE 2 Remote India
    query: 'site:instahyre.com "SDE 2" "Remote" "India"'
    enabled: true

  - name: LinkedIn - Platform Engineer India
    query: 'site:linkedin.com/jobs "Platform Engineer" "India"'
    enabled: true

  - name: Cutshort - Full Stack India
    query: 'site:cutshort.io "Full Stack Engineer" "India"'
    enabled: true

  - name: Hirist - Backend Engineer
    query: 'site:hirist.tech "Backend Engineer"'
    enabled: true

  - name: Wellfound - India startups engineering
    query: 'site:wellfound.com "India" "Software Engineer" startup'
    enabled: true

  - name: Foundit - Java backend
    query: 'site:foundit.in "Java Backend Engineer"'
    enabled: true

  - name: IIMJobs - Engineering manager and senior IC
    query: 'site:iimjobs.com "Engineering" "India"'
    enabled: true

